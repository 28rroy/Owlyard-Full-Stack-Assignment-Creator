AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Assignment Creator Backend - Separate Node.js Lambda functions for each
  HTTP method

  '
Parameters:
  S3BucketName:
    Type: String
    Description: Name of the S3 bucket to store .quiz files
    Default: assignment-creator-quiz-files
Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: '''DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'''
        AllowHeaders: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
  SaveAssignmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SaveAssignmentFunction
      Handler: save_assignment.handler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Role:
        Fn::GetAtt:
        - SaveAssignmentExecutionRole
        - Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: AssignmentsTable
          S3_BUCKET_NAME:
            Ref: S3BucketName
      Events:
        SaveAssignment:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiGateway
            Path: /save-assignment
            Method: post
    Metadata:
      SamResourceId: SaveAssignmentFunction
  GetAssignmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetAssignmentsFunction
      Handler: get_assignments.handler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Role:
        Fn::GetAtt:
        - GetAssignmentsExecutionRole
        - Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: AssignmentsTable
      Events:
        GetAssignments:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiGateway
            Path: /get-assignments
            Method: get
    Metadata:
      SamResourceId: GetAssignmentsFunction
  SaveAssignmentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: SaveAssignmentPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            Resource:
              Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AssignmentsTable
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:PutObjectAcl
            Resource:
              Fn::Sub: arn:aws:s3:::${S3BucketName}/assignment/*
  GetAssignmentsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: GetAssignmentsPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
          - Effect: Allow
            Action:
            - dynamodb:Scan
            - dynamodb:GetItem
            Resource:
              Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AssignmentsTable
  SaveAssignmentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${SaveAssignmentFunction}
      RetentionInDays: 30
  GetAssignmentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${GetAssignmentsFunction}
      RetentionInDays: 30
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod
  SaveAssignmentApi:
    Description: API Gateway endpoint URL for Save Assignment function
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/save-assignment
  GetAssignmentsApi:
    Description: API Gateway endpoint URL for Get Assignments function
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/get-assignments
