AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Assignment Creator Backend - Updated with correct table structure and
  Grades functionality
Parameters:
  S3BucketName:
    Type: String
    Description: Name of the S3 bucket to store .quiz files
    Default: assignment-creator-quiz-files
Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
  Api:
    Cors:
      AllowMethods: '''DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'''
      AllowHeaders: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
      AllowOrigin: '''*'''
Resources:
  AssignmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AssignmentsTable
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: assignmentId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: assignmentId
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
      - IndexName: AssignmentIdIndex
        KeySchema:
        - AttributeName: assignmentId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  SaveAssignmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SaveAssignmentFunction
      Handler: save_assignment.handler
      Policies:
      - DynamoDBWritePolicy:
          TableName:
            Ref: AssignmentsTable
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - s3:PutObject
          - s3:PutObjectAcl
          Resource:
            Fn::Sub: arn:aws:s3:::${S3BucketName}/assignment/*
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME:
            Ref: AssignmentsTable
          S3_BUCKET_NAME:
            Ref: S3BucketName
      Events:
        SaveAssignment:
          Type: Api
          Properties:
            Path: /save-assignment
            Method: post
        SaveAssignmentOptions:
          Type: Api
          Properties:
            Path: /save-assignment
            Method: options
    Metadata:
      SamResourceId: SaveAssignmentFunction
  GetAssignmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetAssignmentsFunction
      Handler: get_assignments.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: AssignmentsTable
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          - dynamodb:Scan
          Resource:
          - Fn::GetAtt:
            - AssignmentsTable
            - Arn
          - Fn::Sub: ${AssignmentsTable.Arn}/index/*
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME:
            Ref: AssignmentsTable
      Events:
        GetAssignments:
          Type: Api
          Properties:
            Path: /get-assignments
            Method: get
        GetAssignmentsOptions:
          Type: Api
          Properties:
            Path: /get-assignments
            Method: options
    Metadata:
      SamResourceId: GetAssignmentsFunction
  AssignmentResponsesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AssignmentResponsesFunction
      Handler: assignment_responses.handler
      Policies:
      - DynamoDBWritePolicy:
          TableName:
            Ref: AssignmentsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: AssignmentsTable
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          - dynamodb:Scan
          Resource:
          - Fn::GetAtt:
            - AssignmentsTable
            - Arn
          - Fn::Sub: ${AssignmentsTable.Arn}/index/*
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME:
            Ref: AssignmentsTable
      Events:
        AssignmentResponsesPost:
          Type: Api
          Properties:
            Path: /assignment-responses
            Method: post
        AssignmentResponsesGet:
          Type: Api
          Properties:
            Path: /assignment-responses
            Method: get
        AssignmentResponsesOptions:
          Type: Api
          Properties:
            Path: /assignment-responses
            Method: options
    Metadata:
      SamResourceId: AssignmentResponsesFunction
  SaveGradesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Lambda function to save assignment grades
      CodeUri: SaveGradesFunction
      Handler: save_grades.handler
      Role:
        Fn::GetAtt:
        - SaveGradesRole
        - Arn
      Environment:
        Variables:
          GRADES_TABLE: gradesTable
          GSI_NAME: UserIdIndex
      Events:
        SaveGradesAPI:
          Type: Api
          Properties:
            Path: /save-grades
            Method: post
        SaveGradesOptions:
          Type: Api
          Properties:
            Path: /save-grades
            Method: options
    Metadata:
      SamResourceId: SaveGradesFunction
  ReadGradesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Lambda function to read assignment grades
      CodeUri: ReadGradesFunction
      Handler: read_grades.handler
      Role:
        Fn::GetAtt:
        - ReadGradesRole
        - Arn
      Environment:
        Variables:
          GRADES_TABLE: gradesTable
          GSI_NAME: UserIdIndex
      Events:
        ReadGradesAPI:
          Type: Api
          Properties:
            Path: /read-grades
            Method: get
        ReadGradesOptions:
          Type: Api
          Properties:
            Path: /read-grades
            Method: options
    Metadata:
      SamResourceId: ReadGradesFunction
  SaveGradesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: SaveGradesLambdaPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            Resource:
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/gradesTable
  ReadGradesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: ReadGradesLambdaPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
          - Effect: Allow
            Action:
            - dynamodb:Query
            - dynamodb:GetItem
            Resource:
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/gradesTable
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/gradesTable/index/UserIdIndex
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  SaveAssignmentApi:
    Description: API Gateway endpoint URL for Save Assignment function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/save-assignment
  GetAssignmentsApi:
    Description: API Gateway endpoint URL for Get Assignments function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/get-assignments
  AssignmentResponsesApi:
    Description: API Gateway endpoint URL for Assignment Responses function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/assignment-responses
  GradesTableName:
    Description: Name of the Grades DynamoDB table (created manually)
    Value: gradesTable
  GradesTableArn:
    Description: ARN of the Grades DynamoDB table (manual)
    Value: arn:aws:dynamodb:*:*:table/gradesTable
  SaveGradesApi:
    Description: API Gateway endpoint URL for Save Grades function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/save-grades
  ReadGradesApi:
    Description: API Gateway endpoint URL for Read Grades function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/read-grades
