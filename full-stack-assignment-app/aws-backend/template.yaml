AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Assignment Creator Backend - Working version without conflicting log groups

Parameters:
  S3BucketName:
    Type: String
    Description: "Name of the S3 bucket to store .quiz files"
    Default: "assignment-creator-quiz-files"

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
  Api:
    Cors:
      AllowMethods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  # Lambda function to save assignments (POST)
  SaveAssignmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: save_assignment.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Policies:
        - DynamoDBWritePolicy:
            TableName: AssignmentsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
              Resource: !Sub "arn:aws:s3:::${S3BucketName}/assignment/*"
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: AssignmentsTable
          S3_BUCKET_NAME: !Ref S3BucketName
      Events:
        SaveAssignment:
          Type: Api
          Properties:
            Path: /save-assignment
            Method: post
        SaveAssignmentOptions:
          Type: Api
          Properties:
            Path: /save-assignment
            Method: options

  # Lambda function to get assignments (GET)
  GetAssignmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: get_assignments.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Policies:
        - DynamoDBReadPolicy:
            TableName: AssignmentsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: AssignmentsTable
      Events:
        GetAssignments:
          Type: Api
          Properties:
            Path: /get-assignments
            Method: get
        GetAssignmentsOptions:
          Type: Api
          Properties:
            Path: /get-assignments
            Method: options

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    
  SaveAssignmentApi:
    Description: "API Gateway endpoint URL for Save Assignment function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/save-assignment"
    
  GetAssignmentsApi:
    Description: "API Gateway endpoint URL for Get Assignments function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/get-assignments"