AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Assignment Creator Backend - Updated with correct table structure

Parameters:
  S3BucketName:
    Type: String
    Description: "Name of the S3 bucket to store .quiz files"
    Default: "assignment-creator-quiz-files"

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
  Api:
    Cors:
      AllowMethods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  # UPDATED: DynamoDB table with correct partition key (userId) and sort key (assignmentId)
  AssignmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AssignmentsTable
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: assignmentId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH    # Partition key
        - AttributeName: assignmentId
          KeyType: RANGE   # Sort key
      BillingMode: PAY_PER_REQUEST
      # Add Global Secondary Index for querying all assignments
      GlobalSecondaryIndexes:
        - IndexName: AssignmentIdIndex
          KeySchema:
            - AttributeName: assignmentId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Lambda function to save assignments (POST)
  SaveAssignmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: save_assignment.handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref AssignmentsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
              Resource: !Sub "arn:aws:s3:::${S3BucketName}/assignment/*"
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AssignmentsTable
          S3_BUCKET_NAME: !Ref S3BucketName
      Events:
        SaveAssignment:
          Type: Api
          Properties:
            Path: /save-assignment
            Method: post
        SaveAssignmentOptions:
          Type: Api
          Properties:
            Path: /save-assignment
            Method: options

  # Lambda function to get assignments (GET)
  GetAssignmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: get_assignments.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AssignmentsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
              Resource: 
                - !GetAtt AssignmentsTable.Arn
                - !Sub "${AssignmentsTable.Arn}/index/*"
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AssignmentsTable
      Events:
        GetAssignments:
          Type: Api
          Properties:
            Path: /get-assignments
            Method: get
        GetAssignmentsOptions:
          Type: Api
          Properties:
            Path: /get-assignments
            Method: options

  # Lambda function for assignment responses
  AssignmentResponsesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: assignment_responses.handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref AssignmentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AssignmentsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
              Resource: 
                - !GetAtt AssignmentsTable.Arn
                - !Sub "${AssignmentsTable.Arn}/index/*"
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AssignmentsTable
      Events:
        AssignmentResponsesPost:
          Type: Api
          Properties:
            Path: /assignment-responses
            Method: post
        AssignmentResponsesGet:
          Type: Api
          Properties:
            Path: /assignment-responses
            Method: get
        AssignmentResponsesOptions:
          Type: Api
          Properties:
            Path: /assignment-responses
            Method: options

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    
  SaveAssignmentApi:
    Description: "API Gateway endpoint URL for Save Assignment function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/save-assignment"
    
  GetAssignmentsApi:
    Description: "API Gateway endpoint URL for Get Assignments function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/get-assignments"

  AssignmentResponsesApi:
    Description: "API Gateway endpoint URL for Assignment Responses function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/assignment-responses"