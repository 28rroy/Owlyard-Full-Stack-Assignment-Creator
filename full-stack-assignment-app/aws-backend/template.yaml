AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Assignment Creator Backend - Lambda function with DynamoDB for storing assignments

Globals:
  Function:
    Timeout: 30
    Runtime: python3.9

Resources:
  # DynamoDB table for storing assignments
  AssignmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AssignmentsTable
      AttributeDefinitions:
        - AttributeName: assignmentId
          AttributeType: S
      KeySchema:
        - AttributeName: assignmentId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Lambda function to save assignments
  SaveAssignmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AssignmentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AssignmentsTable
      Events:
        SaveAssignment:
          Type: Api
          Properties:
            Path: /assignments
            Method: post
        AssignmentOptions:
          Type: Api
          Properties:
            Path: /assignments
            Method: options

  # Lambda function to get assignments (optional - for future use)
  GetAssignmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: get_assignments.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AssignmentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AssignmentsTable
      Events:
        GetAssignments:
          Type: Api
          Properties:
            Path: /assignments
            Method: get

Outputs:
  AssignmentApi:
    Description: "API Gateway endpoint URL for Assignment functions"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/assignments"
    
  SaveAssignmentFunction:
    Description: "Save Assignment Lambda Function ARN"
    Value: !GetAtt SaveAssignmentFunction.Arn
    
  AssignmentsTableName:
    Description: "DynamoDB table name"
    Value: !Ref AssignmentsTable