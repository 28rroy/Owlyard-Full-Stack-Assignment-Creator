AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Assignment Creator Backend - Separate Lambda functions for each HTTP method

Globals:
  Function:
    Timeout: 30
    Runtime: python3.9

Resources:
  # Lambda function to save assignments (POST)
  SaveAssignmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: save_assignment.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: AssignmentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: AssignmentsTable
      Events:
        SaveAssignment:
          Type: Api
          Properties:
            Path: /save-assignment
            Method: post

  # Lambda function to get assignments (GET)
  GetAssignmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: get_assignments.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: AssignmentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: AssignmentsTable
      Events:
        GetAssignments:
          Type: Api
          Properties:
            Path: /get-assignments
            Method: get

Outputs:
  SaveAssignmentApi:
    Description: "API Gateway endpoint URL for Save Assignment function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/save-assignment"
    
  GetAssignmentsApi:
    Description: "API Gateway endpoint URL for Get Assignments function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/get-assignments"