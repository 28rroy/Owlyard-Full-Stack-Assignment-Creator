AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Assignment Creator Backend - Updated with correct table structure and Grades functionality

Parameters:
  S3BucketName:
    Type: String
    Description: "Name of the S3 bucket to store .quiz files"
    Default: "assignment-creator-quiz-files"

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
  Api:
    Cors:
      AllowMethods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  # UPDATED: DynamoDB table with correct partition key (userId) and sort key (assignmentId)
  AssignmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AssignmentsTable
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: assignmentId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH    # Partition key
        - AttributeName: assignmentId
          KeyType: RANGE   # Sort key
      BillingMode: PAY_PER_REQUEST
      # Add Global Secondary Index for querying all assignments
      GlobalSecondaryIndexes:
        - IndexName: AssignmentIdIndex
          KeySchema:
            - AttributeName: assignmentId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # NOTE: GradesTable will be created manually in AWS Console
  # Table name: gradesTable
  # Partition key: assignmentId (String)
  # Sort key: userId (String)
  # GSI: UserIdIndex (userId as partition key, assignmentId as sort key)

  # REUSABLE DynamoDB CRUD Policy
  DynamoDBCRUDPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-DynamoDB-CRUD-Policy"
      Description: "Comprehensive DynamoDB CRUD operations policy for all tables"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              # Read Operations
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              # Write Operations
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
              # Conditional Operations
              - dynamodb:ConditionCheckItem
              # Stream Operations (if needed)
              - dynamodb:DescribeStream
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
              - dynamodb:ListStreams
            Resource:
              - !GetAtt AssignmentsTable.Arn
              - !Sub "${AssignmentsTable.Arn}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/gradesTable"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/gradesTable/index/*"

  # Lambda Basic Execution Policy (for CloudWatch Logs)
  LambdaBasicExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-Lambda-Basic-Execution-Policy"
      Description: "Basic execution policy for Lambda functions (CloudWatch Logs)"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: 
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

  # S3 Access Policy
  S3AccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-S3-Access-Policy"
      Description: "S3 access policy for assignment files"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:DeleteObject
            Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !Sub "arn:aws:s3:::${S3BucketName}"

  # SIMPLIFIED: Common Lambda Execution Role
  CommonLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-Common-Lambda-Execution-Role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref DynamoDBCRUDPolicy
        - !Ref LambdaBasicExecutionPolicy
        - !Ref S3AccessPolicy

  # Lambda function to save assignments (POST)
  SaveAssignmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: save_assignment.handler
      Role: !GetAtt CommonLambdaExecutionRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AssignmentsTable
          S3_BUCKET_NAME: !Ref S3BucketName
      Events:
        SaveAssignment:
          Type: Api
          Properties:
            Path: /save-assignment
            Method: post
        SaveAssignmentOptions:
          Type: Api
          Properties:
            Path: /save-assignment
            Method: options

  # Lambda function to get assignments (GET)
  GetAssignmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: get_assignments.handler
      Role: !GetAtt CommonLambdaExecutionRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AssignmentsTable
      Events:
        GetAssignments:
          Type: Api
          Properties:
            Path: /get-assignments
            Method: get
        GetAssignmentsOptions:
          Type: Api
          Properties:
            Path: /get-assignments
            Method: options

  # Lambda function for assignment responses
  AssignmentResponsesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: assignment_functions/
      Handler: assignment_responses.handler
      Role: !GetAtt CommonLambdaExecutionRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AssignmentsTable
      Events:
        AssignmentResponsesPost:
          Type: Api
          Properties:
            Path: /assignment-responses
            Method: post
        AssignmentResponsesGet:
          Type: Api
          Properties:
            Path: /assignment-responses
            Method: get
        AssignmentResponsesOptions:
          Type: Api
          Properties:
            Path: /assignment-responses
            Method: options

  # NEW: Lambda function to save grades
  SaveGradesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: "Lambda function to save assignment grades"
      CodeUri: assignment_functions/
      Handler: save_grades.handler
      Role: !GetAtt CommonLambdaExecutionRole.Arn
      Environment:
        Variables:
          GRADES_TABLE: gradesTable
          GSI_NAME: UserIdIndex
      Events:
        SaveGradesAPI:
          Type: Api
          Properties:
            Path: /save-grades
            Method: post
        SaveGradesOptions:
          Type: Api
          Properties:
            Path: /save-grades
            Method: options

  # NEW: Lambda function to read grades
  ReadGradesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: "Lambda function to read assignment grades"
      CodeUri: assignment_functions/
      Handler: read_grades.handler
      Role: !GetAtt CommonLambdaExecutionRole.Arn
      Environment:
        Variables:
          GRADES_TABLE: gradesTable
          GSI_NAME: UserIdIndex
      Events:
        ReadGradesAPI:
          Type: Api
          Properties:
            Path: /read-grades
            Method: get
        ReadGradesOptions:
          Type: Api
          Properties:
            Path: /read-grades
            Method: options

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    
  SaveAssignmentApi:
    Description: "API Gateway endpoint URL for Save Assignment function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/save-assignment"
    
  GetAssignmentsApi:
    Description: "API Gateway endpoint URL for Get Assignments function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/get-assignments"

  AssignmentResponsesApi:
    Description: "API Gateway endpoint URL for Assignment Responses function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/assignment-responses"

  # NEW: Grades API Outputs
  GradesTableName:
    Description: "Name of the Grades DynamoDB table (created manually)"
    Value: "gradesTable"
    
  GradesTableArn:
    Description: "ARN of the Grades DynamoDB table (manual)"
    Value: "arn:aws:dynamodb:*:*:table/gradesTable"
    
  SaveGradesApi:
    Description: "API Gateway endpoint URL for Save Grades function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/save-grades"
    
  ReadGradesApi:
    Description: "API Gateway endpoint URL for Read Grades function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/read-grades"

  # IAM Policy Outputs
  DynamoDBCRUDPolicyArn:
    Description: "ARN of the reusable DynamoDB CRUD Policy"
    Value: !Ref DynamoDBCRUDPolicy
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDB-CRUD-Policy-Arn"
  
  CommonLambdaExecutionRoleArn:
    Description: "ARN of the common Lambda execution role"
    Value: !GetAtt CommonLambdaExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Common-Lambda-Role-Arn"